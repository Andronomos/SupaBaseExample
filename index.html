<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Supabase Webpage</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Supabase Demo App</h1>
        <form id="task-form">
            <input type="text" id="task-input" placeholder="Enter a new task..." required autocomplete="off">
            <button type="submit" id="submit-btn">Add Task</button>
        </form>
        <div id="output"></div>
    </main>

    <script src="app.js" defer></script>
</body>
</html>
